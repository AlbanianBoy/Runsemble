version: 2

# Nobody here reads advisory feeds. This is the compensating control: the robot
# watches, opens the pull request, and CI says whether the update is safe. A
# solo maintainer's realistic security posture is "the update arrives already
# tested", not "the maintainer checks weekly".
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    # Enough to be useful, few enough to actually look at. Security updates are
    # exempt from this cap by Dependabot, so a real advisory is never queued
    # behind a pile of routine version bumps.
    open-pull-requests-limit: 5
    groups:
      # One PR per family instead of eleven. These move in lockstep upstream and
      # reviewing them separately tells you nothing extra.
      radix:
        patterns: ["@radix-ui/*"]
      capacitor:
        patterns: ["@capacitor/*", "@capacitor-community/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      types:
        patterns: ["@types/*"]
      # Patch bumps across everything else: individually boring, collectively
      # where most published fixes actually live.
      patch-updates:
        update-types: ["patch"]
    ignore:
      # No majors, from anything. A major version is a migration, not an update:
      # it needs a sitting with the changelog and a run through the app, not a
      # green check on a Monday morning.
      #
      # This started as a short list — next, react, prisma — and that was too
      # clever by half. The first Monday it ran, Dependabot proposed TypeScript
      # 5→7 and recharts 2→3; both failed the build, and neither was on the list
      # because nobody predicts which library breaks next. Minor and patch, where
      # nearly all published fixes actually live, still come through.
      #
      # The trade: Dependabot's security updates also respect this, so an
      # advisory whose only fix is a major bump won't arrive as a PR. That is
      # what the audit job in ci.yml is for — it runs weekly and gates on
      # critical, and a major-version security fix is manual work regardless.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The workflow's own actions are dependencies too, and they run with a token.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
