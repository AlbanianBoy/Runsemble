name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Also runs scripts/postinstall.mjs, which applies the patch-package patch to
      # @capacitor-community/background-geolocation. That patch is what makes
      # screen-off GPS tracking work, so a broken patch fails the build here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generate the Prisma client BEFORE lint/typecheck/test so that
      # @prisma/client imports (e.g. $Enums in enums.test.ts) resolve
      # correctly. Without this step, vitest fails at module resolution
      # because `npm run build` (which calls prisma generate) hasn't run yet.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      # `next build` typechecks too, but only after a slow compile — this fails
      # fast and covers files the build never reaches.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # `prisma generate` already ran above, so this is just `next build`.
      # Nothing connects to a database at build time — the URL only needs to
      # be syntactically valid for Prisma to load the schema, so no secret is
      # required and this workflow runs on forks too.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
