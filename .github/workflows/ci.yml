name: CI

on:
  push:
    branches: [main]
  pull_request:
  # An advisory published on a Tuesday shouldn't wait for the next push to be
  # noticed — and in a quiet week there may not be one.
  schedule:
    - cron: "0 6 * * 1"

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Also runs scripts/postinstall.mjs, which applies the patch-package patch to
      # @capacitor-community/background-geolocation. That patch is what makes
      # screen-off GPS tracking work, so a broken patch fails the build here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generate the Prisma client BEFORE lint/typecheck/test so that
      # @prisma/client imports (e.g. $Enums in enums.test.ts) resolve
      # correctly. Without this step, vitest fails at module resolution
      # because `npm run build` (which calls prisma generate) hasn't run yet.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      # `next build` typechecks too, but only after a slow compile — this fails
      # fast and covers files the build never reaches.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # `prisma generate` already ran above, so this is just `next build`.
      # Nothing connects to a database at build time — the URL only needs to
      # be syntactically valid for Prisma to load the schema, so no secret is
      # required and this workflow runs on forks too.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  # ─── Supply chain ──────────────────────────────────────────────────────────
  # Separate job so an advisory in a build-time transitive never masks a real
  # test failure, and so the whole check can run on a schedule with no push.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocking, and deliberately narrow: CRITICAL, in packages that actually
      # ship. Gating on "high" would fail today and every day — there are a
      # dozen ReDoS advisories in glob matchers that only ever run at build
      # time, none of them fixable here, all of them waiting on upstream. A
      # build that is permanently red teaches you to stop reading it, which
      # costs more than the advisories do. Dependabot handles the long tail;
      # this is the line that means drop everything.
      - name: Audit (critical, production dependencies)
        run: bun audit --prod --audit-level=critical

      # Everything else, reported and never blocking, so the full picture is one
      # click away instead of requiring someone to remember to run it.
      - name: Full advisory report
        if: always()
        run: |
          echo '## Advisories (informational)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bun audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
