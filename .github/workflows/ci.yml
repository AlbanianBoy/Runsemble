name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Also runs scripts/postinstall.mjs, which applies the patch-package patch to
      # @capacitor-community/background-geolocation. That patch is what makes
      # screen-off GPS tracking work, so a broken patch fails the build here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # `prisma generate` + `next build`. Nothing connects to a database at build
      # time — the URL only needs to be syntactically valid for Prisma to load the
      # schema, so no secret is required and this workflow runs on forks too.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
