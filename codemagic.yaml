# Codemagic CI/CD — builds the native iOS app on a cloud Mac (no Mac needed
# locally) and publishes to TestFlight / App Store. Configure the referenced
# integration + variable group in the Codemagic UI (see docs/ios-release-runbook.md).
#
# The app loads runsemble.net via Capacitor server.url, so there is no static web
# build step — `cap sync ios` just refreshes the native shell + plugins.

workflows:
  ios-release:
    name: Runsemble iOS
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      # Create this in Codemagic: Teams → Integrations → App Store Connect (API key).
      app_store_connect: RunsembleASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.runsemble.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.runsemble.app"
        # Set APP_STORE_APP_ID in a variable group once the app exists in App Store Connect.
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo "0")
          agvtool new-version -all $(($LATEST + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Ships each green build to TestFlight so you can install it on a real
        # iPhone. Flip submit_to_app_store to true when you're ready for review.
        submit_to_testflight: true
        submit_to_app_store: false
