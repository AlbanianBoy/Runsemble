<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runsemble</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf8f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      font-size: 3rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    button {
      background: #e8671a;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="logo">🏃</div>
  <h1>You’re offline</h1>
  <p>Check your internet connection and try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
